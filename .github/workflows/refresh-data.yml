name: Refresh data

on:
  schedule:
    # 16:17 UTC (8:17 a.m. Alaska) on the 2nd and 16th of each month
    - cron: "17 16 2,16 * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab
  push:
    # Also run when the scripts, hand-maintained numbers or pages change,
    # so new series and summaries show up without waiting for the schedule.
    branches: [main]
    paths:
      - "scripts/**"
      - "site/data/manual/**"
      - "site/*/index.html"
      - ".github/workflows/refresh-data.yml"

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch live data
        id: fetch
        continue-on-error: true   # still commit whatever did update; the last step fails the run
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}   # optional
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}   # needed for the electricity price
        run: python3 scripts/fetch_data.py

      - name: Fetch electricity prices by utility (EIA-861)
        id: utilities
        continue-on-error: true
        run: |
          pip install --quiet openpyxl
          python3 scripts/fetch_utilities.py

      - name: Fetch Cook Inlet gas production and storage (AOGCC) and Anchorage degree days (NOAA)
        id: cookinlet
        continue-on-error: true
        run: |
          pip install --quiet openpyxl
          python3 scripts/fetch_cook_inlet.py

      - name: Fetch Alaska power plant additions and retirements (EIA-860M)
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python3 scripts/fetch_plant_changes.py

      - name: Refresh the Electricity page's backup data
        continue-on-error: true
        run: python3 scripts/electricity_snapshot.py

      - name: Draft AI summaries
        id: summaries
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # skipped if not set
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}              # optional; default claude-opus-5-5
        run: python3 scripts/write_summaries.py

      - name: Rebuild pages
        run: python3 scripts/build_pages.py

      - name: Commit any new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add site/data site/index.html site/*/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet origin main
            git push
          fi

      - name: Report failures
        if: steps.fetch.outcome == 'failure' || steps.utilities.outcome == 'failure' || steps.cookinlet.outcome == 'failure' || steps.summaries.outcome == 'failure'
        run: |
          echo "::error::Fetch: ${{ steps.fetch.outcome }}. Utilities: ${{ steps.utilities.outcome }}. Cook Inlet: ${{ steps.cookinlet.outcome }}. Summaries: ${{ steps.summaries.outcome }}. See those steps and site/data/status.json."
          exit 1
