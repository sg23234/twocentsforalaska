name: Refresh data

on:
  schedule:
    # 16:17 UTC (8:17 a.m. Alaska) on the 2nd and 16th of each month
    - cron: "17 16 2,16 * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab
  push:
    # Also run when the scripts, hand-maintained numbers or pages change,
    # so new series and summaries show up without waiting for the schedule.
    branches: [main]
    paths:
      - "scripts/**"
      - "site/data/manual/**"
      - "site/*/index.html"
      - ".github/workflows/refresh-data.yml"

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch live data
        id: fetch
        continue-on-error: true   # still commit whatever did update; the last step fails the run
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}   # optional
        run: python3 scripts/fetch_data.py

      - name: Draft AI summaries
        id: summaries
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # skipped if not set
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}              # optional; default claude-opus-5-5
        run: python3 scripts/write_summaries.py

      - name: Commit any new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet origin main
            git push
          fi

      - name: Report failures
        if: steps.fetch.outcome == 'failure' || steps.summaries.outcome == 'failure'
        run: |
          echo "::error::Fetch: ${{ steps.fetch.outcome }}. Summaries: ${{ steps.summaries.outcome }}. See those steps and site/data/status.json."
          exit 1
