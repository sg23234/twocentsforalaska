name: Probe raw files (temporary)
on:
  push:
    branches: [probe-raw]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download
        run: |
          mkdir -p raw && cd raw
          UA="twocentsforalaska.org data refresh (github.com/sg23234/twocentsforalaska)"
          g(){ curl -sSL -A "$UA" -m 120 -o "$1" "$2" || echo "FAIL $1"; ls -la "$1" 2>/dev/null; }
          g components_ak.xlsx "https://live.laborstats.alaska.gov/pop/estimates/data/ComponentsOfChangeAK.xlsx"
          g acs_s2301_2024.json "https://api.census.gov/data/2024/acs/acs1/subject?get=NAME,group(S2301)&for=state:02"
          g acs_s2301_2010.json "https://api.census.gov/data/2010/acs/acs1/subject?get=NAME,group(S2301)&for=state:02"
          g acs_vars_2010.json "https://api.census.gov/data/2010/acs/acs1/subject/groups/S2301.json"
          ls -la
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
          git rm -rq --cached raw/*.csv raw/pfd* raw/pop* raw/fred* raw/bls* 2>/dev/null || true; git add raw; git commit -m "probe raw files" -q; git push
