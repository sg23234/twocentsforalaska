name: Probe gas data (temporary)
on:
  push:
    branches: [probe-gas-data]
    paths: [probe/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git add probe/out.txt && git commit -m "probe output" && git push
